[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "echo 'No app server needed'"
  targetPort = 8888
  functions = "netlify/functions"
  publish = "."

# Redirigir /api/* a las funciones serverless
[[redirects]]
  from = "/api/convert-distance"
  to = "/.netlify/functions/convert-distance"
  status = 200

[[redirects]]
  from = "/api/convert-temperature"
  to = "/.netlify/functions/convert-temperature"
  status = 200

[[redirects]]
  from = "/api/convert-weight"
  to = "/.netlify/functions/convert-weight"
  status = 200
